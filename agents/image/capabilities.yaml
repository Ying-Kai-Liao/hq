# Declarations only. Credentials come from the runtime, never from here.
needs: [codex]   # shared/services; grants in ~/.config/hq/auth.json (hq-auth ls)
tools:
  - img                     # agents/image/tools/img: one entry point for everything below
  - imagegen                # agents/image/tools/imagegen.py → `codex exec` built-in image_gen (gpt-image)
  - finish                  # agents/image/tools/finish.py (Pillow via uv): sizes, formats, exact text, sheets
  - rembg (uvx, local)      # background removal for photos; models in ~/.u2net
  - chart                   # tools/chart.py: Vega-Lite via vl-convert (uv), no browser
  - infographic             # tools/infographic.py: HTML templates → PNG via headless Google Chrome
  - diagram                 # tools/diagram.sh: Mermaid via mmdc (~/.npm-global/bin/mmdc)
  - anatomy                 # skills/anatomy (MIT, wheresryan22/anatomy): isometric SVG explainers; Node 20.10+, Chrome
  - archify (optional)      # ~/.agents/skills/archify, MIT, for showcase architecture diagrams
  - sips                    # macOS image info/convert, no install
helpers: [finance, marketing, devops, personal, branding, designer]   # called for data and facts, read-only asks
state:
  - ~/Workspace/design/<project-id>/images/   # working files (owned, write)
  - ~/.codex/generated_images/                # Codex's raw outputs (read-only; the tool copies from here)
  - ~/.u2net/                                 # rembg models (u2net, isnet-general-use)
credentials (by name, from the runtime):
  - codex ChatGPT login     # ~/.codex/auth.json via `codex login`; never read or copied
access: write its working folder; copying into a repo, or any paid API, needs approval
