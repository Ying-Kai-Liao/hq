# Declarations only. Credentials come from the runtime, never from here.
needs: [notion, telegram]       # shared/services; telegram is the bot that is a member of the household's group
tools:
  - tools/house.py              # stdlib Python CLI: pantry, shopping, split ledger, bills, dishes + cooking, reminders, Notion
                                # (personal runs its `dish` commands from the live path to save dishes)
  - hq-send                     # daily reminder + replies to Telegram
  - Read (images, PDFs)         # receipts are read by the model; no OCR tool
state:
  - data/house.db               # in its home (state folder): source of truth, read-write via the tool only
  - data/config.json            # household people and groups, telegram_chat, default_group
  - data/notion.json            # Notion parent page + database ids (one-way mirror)
schedule:
  - ~/Library/LaunchAgents/dev.hq.house.plist   # 08:00 daily: house remind --send
credentials (by name, from the runtime):
  - NOTION_API_KEY              # via hq-auth (notion service)
  - TELEGRAM_BOT_TOKEN          # via hq-auth (telegram service; the profile is the bot in the household group)
access: write own records; never pays, never messages anyone but the house chat
