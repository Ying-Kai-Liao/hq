# Merge queue (Mergify). Label a PR `queue` to line it up; see docs/ci.md.
# Mergify builds each batch as a draft PR on a mergify/merge-queue/* branch on top of the latest main, and the
# full suite runs there (ci.yml treats those branches as heavy).

# Entry: a non-draft PR with the `queue` label is queued automatically (current Mergify way;
# the old pull_request_rules `queue` action is not how PRs enter the queue any more).
# Needs Merge Protections turned on for the repo in the Mergify dashboard.
merge_protections_settings:
  auto_merge_conditions:
    - label = queue
    - -draft

queue_rules:
  - name: default
    merge_method: merge
    batch_size: 8
    # A lone PR waits at most this long for company before it is tested.
    batch_max_wait_time: 3 min
    queue_conditions:
      - base = main
      - -draft
      - check-success = ci
    merge_conditions:
      - check-success = ci

pull_request_rules:
  # So that adding the label again re-queues a PR that left the queue.
  - name: drop the queue label once merged
    conditions:
      - merged
      - label = queue
    actions:
      label:
        remove:
          - queue
